<!-- Main Sidebar Container -->
<aside class="main-sidebar sidebar-dark-primary elevation-4">
  <!-- Brand Logo -->
  <a href="#" class="brand-link">
    <img
      [src]="imgPath.logo"
      alt="IMG"
      class="brand-image img-circle elevation-3"
      style="opacity: 0.8"
    />
    <span class="brand-text font-weight-light"> G-SPER </span>
  </a>

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Sidebar user panel (optional) -->
    <div class="user-panel mt-3 pb-3 mb-3 d-flex">
      <div class="image">
        <img
          [src]="imgPath.user"
          class="img-circle elevation-2"
          alt="User Image"
        />
      </div>
      <div class="info">
        <a href="#" class="d-block"> Username </a>
      </div>
    </div>
    <!-- Sidebar Menu -->
    <nav class="mt-2">
      <ul
        class="nav nav-pills nav-sidebar flex-column"
        data-widget="treeview"
        role="menu"
        data-accordion="false"
      >
        <li class="nav-item menu-open">
          <a routerLink="/" class="nav-link">
            <i class="nav-icon fa-thin fa-gauge"></i>
            <p>Tableau de bord</p>
          </a>
        </li>
        <li class="nav-item mb-2">
          <a href="#" class="nav-link">
            <i class="nav-icon fa-thin fa-users"></i>
            <p>
              Agents
              <i class="fas fa-angle-left right"></i>
            </p>
          </a>
          <ul class="nav nav-treeview">
            <li class="nav-item">
              <a
                routerLink="/management/coach/save"
                routerLinkActive="active"
                class="nav-link"
              >
                <span class="ml-4"> Création </span>
              </a>
            </li>
            <li class="nav-item">
              <a
                routerLink="/coach/show"
                routerLinkActive="active"
                class="nav-link"
              >
                <span class="ml-4"> List des agents </span>
              </a>
            </li>
          </ul>
        </li>
        <li class="nav-item mb-2">
          <a href="#" class="nav-link">
            <i class="nav-icon bi bi-person"></i>
            <p>
              Dossiers
              <i class="fas fa-angle-left right"></i>
            </p>
          </a>
          <ul class="nav nav-treeview">
            <li class="nav-item">
              <a
                routerLink="/coach/dossiers/create"
                routerLinkActive="active"
                class="nav-link"
              >
                <span class="ml-4">
                  Création
                </span>
              </a>
            </li>
            <li class="nav-item">
              <a
                routerLink="/coach/dossiers"
                routerLinkActive="active"
                class="nav-link"
              >
                <span class="ml-4"> Liste de dossiers </span>
              </a>
            </li>
          </ul>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">
            <i class="nav-icon fa-thin fa-toolbox"></i>
            <p>
              Management
              <i class="fas fa-angle-left right"></i>
            </p>
          </a>
          <ul class="nav nav-treeview">
            <li class="nav-item">
              <a
                routerLink="langue-parlee"
                routerLinkActive="active"
                class="nav-link"
              >
                <i class="far fa-circle nav-icon"></i>
                <p>Langues</p>
              </a>
            </li>
            <li class="nav-item">
              <a
                routerLink="experience-pro"
                routerLinkActive="active"
                class="nav-link"
              >
                <i class="far fa-circle nav-icon"></i>
                <p>Experience</p>
              </a>
            </li>
            <li class="nav-item">
              <a
                routerLink="competences"
                routerLinkActive="active"
                class="nav-link"
              >
                <i class="far fa-circle nav-icon"></i>
                <p>Competences</p>
              </a>
            </li>
            <li class="nav-item">
              <a
                routerLink="formations"
                routerLinkActive="active"
                class="nav-link"
              >
                <i class="far fa-circle nav-icon"></i>
                <p>Formations</p>
              </a>
            </li>
          </ul>
        </li>
        <li class="nav-item">
          <a routerLink="login" routerLinkActive="active" class="nav-link">
            <i class="fa-thin fa-arrow-right-from-bracket nav-icon"></i>
            <p>Déconnection</p>
          </a>
        </li>
      </ul>
    </nav>
    <!-- /.sidebar-menu -->
  </div>
  <!-- /.sidebar -->
</aside>
