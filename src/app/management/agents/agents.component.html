<!-- Content Header (Page header) -->
<section class="content-header">
  <div class="container-fluid mt-4">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h3>CREATION D'UN AGENT</h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item">
            <a routerLink="/"> Liste des agents </a>
          </li>
          <li class="breadcrumb-item active">Editer Agent</li>
        </ol>
      </div>
    </div>
  </div>
  <!-- /.container-fluid -->
</section>
<!-- Main content -->
<section class="content">
  <div class="container-fluid">
    <form autocomplete="off" [formGroup]="coachForm" (ngSubmit)="createCoach()">
      <div class="row">
        <!-- left column -->
        <div class="col-md-6">
          <!-- general form elements -->
          <div class="card">
            <!-- /.card-header -->
            <div class="card-header">
              <div class="card-title">
                <h4>INFO 1</h4>
              </div>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-4">
                  <div class="form-group">
                    <label class="form-label">Nom :</label>
                    <input
                      type="text"
                      name="name"
                      formControlName="name"
                      class="form-control"
                      placeholder="le nom..."
                    />
                  </div>
                </div>
                <div class="col-4">
                  <label class="form-label">Post-nom :</label>
                  <input
                    type="text"
                    name="lastname"
                    formControlName="lastname"
                    class="form-control"
                    placeholder="nom de famille..."
                  />
                </div>
                <div class="col-4">
                  <label class="form-label">Prenom :</label>
                  <input
                    type="text"
                    name="firstname"
                    formControlName="firstname"
                    class="form-control"
                    placeholder="le prenom..."
                  />
                </div>
              </div>

              <!-- row lieu de naissance et dateNaissance -->
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Lieu de naissance :</label>
                    <input
                      type="text"
                      name="placeOfBirt"
                      id="placeOfBirt"
                      formControlName="placeOfBirt"
                      class="form-control"
                      placeholder="lieu de naissance..."
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <label>Date de naissance : </label>
                  <input
                    type="date"
                    name="dateOfBirt"
                    id="dateOfBirt"
                    formControlName="dateOfBirt"
                    class="form-control"
                  />
                </div>
              </div>
              <!-- end row lieu de naissance et dateNaissance -->

              <!-- row sexe et civilité -->
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Sexe :</label>
                    <select
                      name="sex"
                      id="sex"
                      formControlName="sex"
                      class="form-select select shadow-none"
                    >
                      <option selected>Selectionner le sexe</option>
                      <option value="Masculin">Masculin</option>
                      <option value="Feminin">Feminin</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-6">
                  <label>Formation :</label>
                  <select
                    formControlName="civilite"
                    class="form-select select shadow-none"
                  >
                    <option selected>Selectionner la formation</option>
                    <ng-container *ngFor="let f of formationDATA | async">
                      <option value="f.id">{{ f.Ecole }}</option>
                    </ng-container>
                  </select>
                </div>
              </div>
              <!-- end row sexe et civilité -->

                <!-- row Langue &   -->
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Sexe :</label>
                    <select name="sex" id="sex" formControlName="sex" class="form-select select shadow-none">
                      <option selected>Selectionner le sexe</option>
                      <option value="Masculin">Masculin</option>
                      <option value="Feminin">Feminin</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-6">
                  <label>Formation :</label>
                  <select  formControlName="civilite" class="form-select select shadow-none">
                    <option selected>Selectionner la formation</option>
                    <ng-container *ngFor="let f of formationDATA | async">
                      <option value="f.id">{{f.Ecole}}</option>
                    </ng-container>
                  </select>
                </div>
              </div>
              <!-- end row sexe et civilité -->

              <!-- Province et Localité -->
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Province :</label>
                    <input
                      type="text"
                      name="placeOfBirt"
                      id=""
                      formControlName="placeOfBirt"
                      class="form-control"
                      placeholder="province..."
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <label>Territoire : </label>
                  <input
                    type="text"
                    name="placeOfBirt"
                    id=""
                    formControlName="placeOfBirt"
                    class="form-control"
                    placeholder="territoire..."
                  />
                </div>
              </div>
              <!-- end row lieu de naissance et dateNaissance -->

              <div class="row">
                <div class="col-md-12">
                  <!-- nationalité-->
                  <div class="form-group">
                    <label>Nationalité :</label>
                    <select
                      name="nationalite"
                      formControlName="nationalite"
                      id="nationalite"
                      class="form-select shadow-none"
                    >
                      <option selected>La nationalité</option>
                      <ng-container *ngFor="let n of experienceDATA | async">
                        <option value="n.id">{{ n.title }}</option>
                      </ng-container>
                    </select>
                  </div>
                  <!-- end nationalité-->
                </div>
              </div>

              <div class="form-group">
                <label>Exeperience Professionelle :</label>
                <input
                  type="text"
                  name="experience_pro"
                  formControlName="professionalExp"
                  id="experience_pro"
                  class="form-control"
                />
              </div>
            </div>
          </div>
          <!-- /.card -->
        </div>
        <!--/.col (left) -->

        <!-- right column -->
        <div class="col-md-6">
          <!-- general form elements -->
          <div class="card">
            <!-- /.card-header -->
            <div class="card-header">
              <div class="card-title">
                <h4>INFO 2</h4>
              </div>
            </div>
            <div class="card-body">
              <!-- coach image -->
              <div class="container mb-3">
                <div class="col-md-12 mb-2 prop_img">
                  <img
                    [src]="imageURL ? imageURL : Path.user"
                    *ngIf="imageURL ? imageURL : Path.user"
                    alt="IMG"
                    class="img img-thumbnail coach_img"
                    name="imageUpload"
                    formControlName="imageUpload"
                  />
                </div>
                <div class="d-flex prop_button">
                  <input
                    #onFileInput
                    type="file"
                    name="imageUpload"
                    formControlName="imageUpload"
                    id="imageUpload"
                    accept="/*"
                    (change)="onSelectFile($event)"
                    style="display: none"
                  />
                  <button
                    type="button"
                    (click)="onFileInput.click()"
                    class="btn btn-danger"
                  >
                    Gallerie...
                    <i class="fas fa-camera"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-primary btn-sm btn_p_photo"
                  >
                    Prendre une photo
                    <i class="fas fa-video"></i>
                  </button>
                </div>
              </div>
              <!-- end coach image -->

              <div class="row">
                <div class="col-md-11"></div>
                <div class="col-md-1 button_hauteur">
                  <button
                    class="btn btn-primary btn-sm"
                    routerLink="/couleur-des-yeux"
                  >
                    <i class="fas fa-plus-circle"></i>
                  </button>
                </div>
              </div>

              <!--row Telephone 1 et telephone 2-->
              <div class="row">
                <div class="col-md-6">
                  <label>Téléphone Line 1 : </label>
                  <input
                    type="tel"
                    class="form-control"
                    id="phoneNumber"
                    formControlName="phoneNumber"
                    name="phoneNumber"
                    placeholder="phone number"
                  />
                </div>
                <div class="col-md-6">
                  <label>Téléphone Line 2 :</label>
                  <input
                    type="tel"
                    name="phoneNumber"
                    placeholder="phoneNumber1"
                    formControlName="phoneNumber1"
                    id="phoneNumber1"
                    class="form-control"
                  />
                </div>
              </div>
              <!--row Telephone 1 et telephone 2-->

              <!-- Email -->
              <div class="form-group mt-2">
                <label>Email :</label>
                <input
                  type="email"
                  name="email"
                  id="email"
                  class="form-control shadow-none"
                  formControlName="email"
                  placeholder="exemple@exemple.com"
                />
              </div>
              <!--End Email-->
            </div>
          </div>
          <!-- /.card -->
        </div>
        <!--/.col (right) -->
      </div>
      <!-- /.row -->
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div class="card-header">
              <div class="card-title">
                <h3>ADRESSE</h3>
              </div>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-lg-12">
                  <div class="form-group">
                    <label class="form-label"
                      >Address(Commune,Quartier,Avenue,Numéro) :</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      placeholder="address..."
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- card button -->
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div class="card-body">
              <div class="float-right">
                <button
                  class="btn btn-success mr-1 text-white btn-sm"
                  routerLink="/coach/liste-des-coachs"
                >
                  Voir les coachs
                </button>
                <button class="btn btn-danger mr-1 btn-sm">Annuler</button>
                <button
                  type="submit"
                  [disabled]="coachForm.invalid"
                  class="btn btn-primary btn-sm"
                >
                  Enregister
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- end card button-->
    </form>
  </div>
  <!-- /.container-fluid -->
</section>
