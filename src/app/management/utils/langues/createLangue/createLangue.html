<div style="background: blue !important; height: 4rem !important;">
  <h2 mat-dialog-title>
  <span *ngIf="!data.id" class="text-white">
    CREATE NEW LANGUES
  </span>
    <span *ngIf="data.id" class="text-white" style="line-height: 12px;">
    You are updating with Name : {{ data.name }}
  </span>
  </h2>
</div>
<mat-dialog-content>
  <div class="container">
    <form [formGroup]="langueForm" (ngSubmit)="onSubmit()">
      <input type="text" name="id" formControlName="i" id="id" class="form-control d-none">
      <div class="form-group">
        <label class="form-label">
          Identité de l'agent :
        </label>
        <select name="iagent" id="iagent" formControlname="idAgent" class="form-select shadow-none">
          <option value="#">Selectionner l'agent</option>
          <ng-container *ngFor="let ag of agentData">
            <option [value]="ag.id">
              {{ag.name}}
              {{ag.lastname}} 
              {{ag.firstname}}
            </option>
          </ng-container>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Langue :</label>
        <input type="text" name="name" formControlName="name" id="name" class="form-control" placeholder="langue...">
      </div>
      <div class="form-group">
        <label class="form-label">Niveau :</label>
        <input type="text" formControlName="level" name="level" id="level" class="form-control" placeholder="niveau...">
      </div>
      <div class="form-group">
        <label class="form-label">Observation :</label>
        <input type="text" formControlName="Observation" name="observation" id="observation" class="form-control" placeholder="observation...">
      </div>
      <div class="float-right">
        <button type="button" class="btn btn-danger mr-1" mat-dialog-close>Close</button>
        <button type="submit" class="btn btn-primary" [disabled]="langueForm.invalid">
          <span *ngIf="!loading">Submit</span>
          <div *ngIf="loading" class="spinner-border spinner-border-sm" role="status">
            <span class="sr-only">loading...</span>
          </div>
        </button>
      </div>
    </form>
  </div>
</mat-dialog-content>
