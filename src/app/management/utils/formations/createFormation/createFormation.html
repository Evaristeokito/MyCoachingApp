<!-- Content Header (Page header) -->
<section class="content-header">
  <div class="container-fluid mt-4">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h3>CREATION FORMATION</h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item"><a href="#">Home</a></li>
          <li class="breadcrumb-item active">Formations</li>
        </ol>
      </div>
    </div>
  </div>
  <!-- /.container-fluid -->
</section>
<div class="content">
  <div class="container-fluid">
    <form [formGroup]="formationForm" (ngSubmit)="onSubmit()">
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <h4>LISTE DES AGENTS</h4>
          </div>
        </div>
        <!-- Corps de la Card -->
        <div class="card-body">
          <div class="card shadow-none" style="outline: none; border: none">
            <div class="card-body">
              <div
                class="d-flex flex-row align-items-center justify-content-center align-content-center"
              >
                <!--form-search-->
                <form action="">
                  <div
                    class="d-flex flex-row justify-content-center align-content-center align-items-center gap-1 form-search-center"
                  >
                    <button class="btn btn-search">
                      <i class="fa-thin fa-magnifying-glass"></i>
                    </button>
                    <input
                      type="text"
                      name=""
                      id=""
                      class="form-control input-search"
                      placeholder="Rechercher l'agent par son nom , postnom ou prénom"
                      [formControl]="searchControl"
                    />
                  </div>
                </form>
                <!-- end form search -->
              </div>
            </div>
          </div>
          <div
            class="card-body table-responsive p-0 mt-3"
            style="height: 200px"
          >
            <table class="table table-head-fixed table-striped">
              <thead>
                <tr>
                  <th>Nom</th>
                  <th>PostNom</th>
                  <th>Prenom</th>
                  <th>Sexe</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr
                  *ngFor="let gt of filteredAgents ; let i = index"
                  [class.selected-row]="selectedRowIndex===i"
                >
                  <td (click)="selectRow(i)">{{ gt.name }}</td>
                  <td (click)="selectRow(i)">{{ gt.firstname }}</td>
                  <td (click)="selectRow(i)">{{ gt.lastname }}</td>
                  <td (click)="selectRow(i)">{{gt.sex }}</td>
                  <td>
                    <button
                      type="button"
                      class="btn btn-sm btn-warning me-2"
                      (click)="selectRow(i)"
                      (click)="getAgentById(gt.id)"
                    >
                      Assigner
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <h4>AGENT INFORMATION</h4>
          </div>
        </div>

        <div class="card-body">
          <div class="row">
             <input
                  type="hidden"
                  name="name"
                  formControlName="agentId"
                  class="form-control"
                />
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label"> Nom : </label>
                <input
                  type="text"
                  name="name"
                  formControlName="name"
                  class="form-control"
                  placeholder="le nom..."
                  readonly
                />
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Post-nom :</label>
              <input
                type="text"
                name="lastname"
                formControlName="lastname"
                class="form-control"
                placeholder="nom de famille..."
                readonly
              />
            </div>
            <div class="col-md-4">
              <label class="form-label">Prenom :</label>
              <input
                type="text"
                name="firstname"
                formControlName="firstname"
                class="form-control"
                placeholder="le prenom..."
                readonly
              />
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <h4>FORMATION INFORMATION</h4>
        </div>
        <div class="card-body">
          
          <input
            type="text"
            name="id"
            formControlName="i"
            id="id"
            class="form-control d-none"
          />

          <div formArrayName="formations">
            <div
              *ngFor="let item of formations.controls; let i=index"
              [formGroupName]="i"
              class="row mt-3"
            >
            <span class="badge badge-secondary mb-3">
              Formation {{ i + 1 }}
            </span>
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Titre :</label>
                    <input
                      type="text"
                      name="title"
                      formControlName="title"
                      id="name"
                      class="form-control"
                      placeholder="titre (diplome,attestation de reussite)..."
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Faculté :</label>
                    <input
                      type="text"
                      formControlName="faculty"
                      name="faculty"
                      id="faculty"
                      class="form-control"
                      placeholder="faculté..."
                    />
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Ecole :</label>
                    <input
                      type="text"
                      name="ecole"
                      formControlName="ecole"
                      id="ecole"
                      class="form-control"
                      placeholder="ecole..."
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="form-label">Options :</label>
                    <input
                      type="text"
                      name="Options"
                      formControlName="options"
                      id="options"
                      class="form-control"
                      placeholder="option..."
                    />
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-6">
                  <div class="form-group">
                    <label class="form-label">Date début :</label>
                    <input
                      type="date"
                      name="startDate"
                      formControlName="startDate"
                      id="startDate"
                      class="form-control"
                    />
                  </div>
                </div>
                <div class="col-6">
                  <div class="form-group">
                    <label class="form-label">Date de fin :</label>
                    <input
                      type="date"
                      name="endDate"
                      formControlName="endDate"
                      id="endDate"
                      class="form-control"
                    />
                  </div>
                </div>
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button
                  type="button"
                  class="btn btn-danger"
                  (click)="removeFormation(i)"
                >
                  Supprimer
                </button>
              </div>
            </div>
          </div>
          <div class="mt-3">
            <button
              type="button"
              class="btn btn-success"
              (click)="addFormation()"
            >
              Associé la formation (Education) à l'agent
            </button>
          </div>
        </div>
      </div>
      <div class="float-right">
        <button type="button" class="btn btn-danger mr-1" mat-dialog-close>
          Fermer
        </button>
        <button
          type="submit"
          class="btn btn-primary"
        >
          <span *ngIf="!loading">Enregistrer </span>
          <div
            *ngIf="loading"
            class="spinner-border spinner-border-sm"
            role="status"
          >
            <span class="sr-only">loading...</span>
          </div>
        </button>
      </div>
    </form>
  </div>
</div>
