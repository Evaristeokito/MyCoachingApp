<div style="background: blue !important; height: 4rem !important">
  <h2 mat-dialog-title>
    <span *ngIf="!data.id" class="text-white"> CREATE NEW FORMATION </span>
    <span *ngIf="data.id" class="text-white" style="line-height: 12px">
      You are updating with Name : {{ data.name }}
    </span>
  </h2>
</div>
<mat-dialog-content>
  <div class="container">
    <form [formGroup]="experienceForm" (ngSubmit)="onSubmit()">
      <input
        type="text"
        name="id"
        formControlName="id"
        id="id"
        class="form-control d-none"
      />
      <div class="form-group">
        <label class="form-label">Poste :</label>
        <input
          type="text"
          name="title"
          formControlName="title"
          id="name"
          class="form-control"
          placeholder="posté occupé..."
        />
      </div>
       <div class="form-group">
        <label class="form-label">Company :</label>
        <input
          type="text"
          name="title"
          formControlName="company"
          id="name"
          class="form-control"
          placeholder="le nom de la company.."
        />
      </div>
      <div class="form-group">
        <label class="form-label">Date début : </label>
        <input
          type="date"
          formControlName="startdate"
          name="startdate"
          id="startdate"
          class="form-control"
          placeholder="faculté..."
        />
      </div>
      <div class="form-group">
        <label class="form-label">Date Fin :</label>
        <input
          type="date"
          name="enddate"
          formControlName="enddate"
          id="ecole"
          class="form-control"
          placeholder="ecole..."
        />
      </div>
      <div class="form-group">
        <label class="form-label">Description :</label>
        <input
          type="text"
          name="title"
          formControlName="description"
          id="name"
          class="form-control"
          placeholder="description..."
        />
      </div>
      <div class="float-right">
        <button type="button" class="btn btn-danger mr-1" mat-dialog-close>
          Close
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="experienceForm.invalid"
        >
          <span *ngIf="!loading">Submit</span>
          <div
            *ngIf="loading"
            class="spinner-border spinner-border-sm"
            role="status"
          >
            <span class="sr-only">loading...</span>
          </div>
        </button>
      </div>
    </form>
  </div>
</mat-dialog-content>
