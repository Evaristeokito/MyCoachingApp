<!-- Content Header (Page header) -->
<section class="content-header">
  <div class="container-fluid mt-4">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h3>
          MANAGEMENT EXPERIENCE PROF
        </h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item"><a href="#">Home</a></li>
          <li class="breadcrumb-item active">Formations</li>
        </ol>
      </div>
    </div>
  </div>
  <!-- /.container-fluid -->
</section>
<!-- Main content -->
<section class="content">
  <div class="container-fluid">
    <div class="row">
      <!-- left column -->
      <div class="col-md-12">
        <!-- general form elements -->
        <div class="card">
          <div class="card-header">
            <div class="row">
              <div class="col-lg-12">
                <div class="float-right">
                  <button class="btn btn-primary" (click)="dialogColors()">
                    Création d'une experience
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-body">
            <div
              class="card-body table-responsive p-0 mt-3"
              style="height: 400px"
            >
              <table class="table table-striped table-head-fixed">
                <thead class="thead">
                <tr>
                  <th>N°</th>
                  <th>Agent</th>
                  <th>Titre</th>
                  <th>Company</th>
                  <th>StartDate</th>
                  <th>EndDate</th>
                  <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr
                  *ngFor="
                      let item of experienceDATA | slice: (page-1) * pageSize : page * pageSize;
                      let i = index
                    "
                >
                  <td>{{ i + 1 }}</td>
                  <td>{{item.agent.name}} {{item.agent.firstname}} {{item.agent.lastname}}</td>
                  <td>{{ item.title }}</td>
                  <td>{{ item.company}}</td>
                  <td>{{ item.startdate }}</td>
                  <td>{{ item.enddate }}</td>
                  <td>
                    <div class="dropdown">
                      <button class="btn btn-secondary btn-sm" type="button" id="dropdownMenuButton1"
                              data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-three-dots"></i>
                      </button>
                      <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                        <li><a class="dropdown-item" (click)="dialogColors(item)">
                          <i class="bi bi-pen"></i>
                          Update
                        </a></li>
                        <li><a class="dropdown-item">
                          <i class="bi bi-trash3"></i>
                          Delete
                        </a></li>
                      </ul>
                    </div>
                  </td>
                </tr>
                </tbody>
              </table>
            </div>

            <div *ngIf="experienceDATA.length > 0" class="pagination mt-3 d-flex justify-content-end align-items-end">
              <ngb-pagination
                [collectionSize]="experienceDATA.length"
                [(page)]="page"
                [maxSize]="pageSize"
                [rotate]="true"
                [ellipses]="false"
                [boundaryLinks]="true"></ngb-pagination>
            </div>
          </div>
        </div>
        <!-- /.card -->
      </div>
      <!--/.col (left) -->
    </div>
    <!-- /.row -->
  </div>
  <!-- /.container-fluid -->
</section>
